name: Deploy VPS

# Deploy por PULL de imagem (sem build na VPS). As imagens sao buildadas e
# publicadas no GHCR pelo workflow build-images.yml; aqui so fazemos
# `docker compose pull` + `up --no-build` no ambiente escolhido.
#
# Pre-requisitos:
# - build-images.yml ja publicou a tag escolhida (ghcr.io/.../omni-{api,web}:<tag>);
# - a VPS ja tem `docker login ghcr.io` valido (PAT read-only) para puxar imagens privadas;
# - o .env do ambiente (.env.production / .env.staging) ja existe no path remoto.
#
# Migrations: a imagem da api roda `migrate up` no boot. Release que toca schema
# precisa de backup_database=true. Ver docs/DEPLOY_VPS.md.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Ambiente alvo
        required: true
        default: staging
        type: choice
        options:
          - staging
          - prod
      image_tag:
        description: "Tag da imagem no GHCR (ex. sha-<40hex>). Vazio => sha-<HEAD do git_ref>."
        required: false
        default: ""
        type: string
      git_ref:
        description: Git ref de onde sai o docker-compose.prod.yml
        required: false
        default: main
        type: string
      backup_database:
        description: Backup do Postgres antes do deploy (obrigatorio em release de schema)
        required: false
        default: true
        type: boolean
      force_recreate:
        description: Forcar recreate dos servicos
        required: false
        default: false
        type: boolean
      skip_smoke_tests:
        description: Pular smoke tests publicos
        required: false
        default: false
        type: boolean
      deploy_automation:
        description: Subir profile automation e reimportar workflows n8n versionados
        required: false
        default: false
        type: boolean
      force_automation_workflow_import:
        description: Forcar reimport dos workflows n8n mesmo sem mudanca de hash
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: deploy-lista-atendimento-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DEPLOY_HOST: 85.31.62.33
      DEPLOY_PORT: "22"
      DEPLOY_USER: deploy
    steps:
      - name: Checkout target ref
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.git_ref }}

      - name: Resolve environment + image tag
        run: |
          set -euo pipefail
          if [[ "${{ inputs.environment }}" == "prod" ]]; then
            echo "REMOTE_PATH=/home/deploy/lista-atendimento" >> "$GITHUB_ENV"
            echo "ENV_FILE=.env.production" >> "$GITHUB_ENV"
            echo "PUBLIC_BASE_URL=https://omni.crowvisuals.com.br" >> "$GITHUB_ENV"
          else
            echo "REMOTE_PATH=/home/deploy/lista-atendimento-staging" >> "$GITHUB_ENV"
            echo "ENV_FILE=.env.staging" >> "$GITHUB_ENV"
            echo "PUBLIC_BASE_URL=https://preview.whenthelightsdie.com" >> "$GITHUB_ENV"
          fi

          tag="${{ inputs.image_tag }}"
          if [[ -z "$tag" ]]; then
            tag="sha-$(git rev-parse HEAD)"
            echo "image_tag vazio; usando $tag (build-images.yml precisa ter publicado essa tag)."
          fi
          echo "IMAGE_TAG=$tag" >> "$GITHUB_ENV"

      - name: Configure SSH access
        env:
          DEPLOY_VPS_SSH_KEY: ${{ secrets.DEPLOY_VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "$DEPLOY_VPS_SSH_KEY" ]]; then
            echo "Secret DEPLOY_VPS_SSH_KEY ausente." >&2
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_VPS_SSH_KEY" > ~/.ssh/deploy_vps
          chmod 600 ~/.ssh/deploy_vps
          ssh-keyscan -p "$DEPLOY_PORT" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Validate required remote environment
        run: |
          set -euo pipefail
          cat > /tmp/preflight_env.sh << REMOTE_SCRIPT
          set -euo pipefail
          mkdir -p "$REMOTE_PATH"
          cd "$REMOTE_PATH"
          if [ ! -f "$ENV_FILE" ]; then
            echo "ERRO: $ENV_FILE nao existe em $REMOTE_PATH. Crie-o a partir do .example antes do deploy." >&2
            exit 1
          fi
          omni_key=\$(sed -n 's/^OMNI_SECRETS_KEY=//p' "$ENV_FILE" | tail -n 1)
          if [ -z "\$omni_key" ]; then
            echo "ERRO: OMNI_SECRETS_KEY ausente/vazia em $ENV_FILE. Gere uma vez com: openssl rand -base64 32" >&2
            exit 1
          fi
          if ! printf '%s' "\$omni_key" | grep -Eq '^[A-Za-z0-9+/]{43}=$'; then
            echo "ERRO: OMNI_SECRETS_KEY nao e base64 canonico de 32 bytes em $ENV_FILE." >&2
            exit 1
          fi
          if ! decoded_bytes=\$(printf '%s' "\$omni_key" | openssl base64 -d -A 2>/dev/null | wc -c | tr -d ' '); then
            echo "ERRO: OMNI_SECRETS_KEY nao e base64 valido em $ENV_FILE." >&2
            exit 1
          fi
          unset omni_key
          if [ "\$decoded_bytes" != "32" ]; then
            echo "ERRO: OMNI_SECRETS_KEY deve decodificar exatamente 32 bytes; encontrado(s): \$decoded_bytes." >&2
            exit 1
          fi
          echo "Preflight de segredos obrigatorios: OK"
          REMOTE_SCRIPT
          ssh -i ~/.ssh/deploy_vps -o StrictHostKeyChecking=yes -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" 'bash -s' < /tmp/preflight_env.sh

      - name: Copy docker-compose.prod.yml to VPS
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_vps -o StrictHostKeyChecking=yes -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$REMOTE_PATH'"
          scp -i ~/.ssh/deploy_vps -o StrictHostKeyChecking=yes -P "$DEPLOY_PORT" docker-compose.prod.yml "$DEPLOY_USER@$DEPLOY_HOST:$REMOTE_PATH/docker-compose.prod.yml"

      - name: Copy automation workflows to VPS
        if: ${{ inputs.deploy_automation }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_vps -o StrictHostKeyChecking=yes -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$REMOTE_PATH/automation/export'"
          scp -i ~/.ssh/deploy_vps -o StrictHostKeyChecking=yes -P "$DEPLOY_PORT" automation/export/workflow-*.json "$DEPLOY_USER@$DEPLOY_HOST:$REMOTE_PATH/automation/export/"

      - name: Set IMAGE_TAG in remote env
        run: |
          set -euo pipefail
          cat > /tmp/set_tag.sh << REMOTE_SCRIPT
          set -euo pipefail
          cd "$REMOTE_PATH"
          if [ ! -f "$ENV_FILE" ]; then
            echo "ERRO: $ENV_FILE nao existe em $REMOTE_PATH. Crie-o a partir do .example." >&2
            exit 1
          fi
          docker compose --env-file "$ENV_FILE" -f docker-compose.prod.yml config --quiet
          if grep -q '^IMAGE_TAG=' "$ENV_FILE"; then
            sed -i "s|^IMAGE_TAG=.*|IMAGE_TAG=$IMAGE_TAG|" "$ENV_FILE"
          else
            printf 'IMAGE_TAG=%s\n' "$IMAGE_TAG" >> "$ENV_FILE"
          fi
          grep '^IMAGE_TAG=' "$ENV_FILE"
          REMOTE_SCRIPT
          ssh -i ~/.ssh/deploy_vps -o StrictHostKeyChecking=yes -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" 'bash -s' < /tmp/set_tag.sh

      - name: Backup remote database
        if: ${{ inputs.backup_database }}
        run: |
          set -euo pipefail
          cat > /tmp/backup.sh << REMOTE_SCRIPT
          set -euo pipefail
          cd "$REMOTE_PATH"
          mkdir -p backups
          docker compose --env-file "$ENV_FILE" -f docker-compose.prod.yml exec -T postgres \
            sh -lc 'pg_dump -U "\$POSTGRES_USER" -d "\$POSTGRES_DB"' \
            | gzip > "backups/backup_\$(date +%Y%m%d_%H%M%S).sql.gz"
          latest=\$(ls -t backups | head -n 1)
          printf '%s\n' "$REMOTE_PATH/backups/\$latest"
          REMOTE_SCRIPT
          ssh -i ~/.ssh/deploy_vps -o StrictHostKeyChecking=yes -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" 'bash -s' < /tmp/backup.sh

      - name: Pull and up (no build)
        run: |
          set -euo pipefail
          force=""
          if [[ "${{ inputs.force_recreate }}" == "true" ]]; then
            force=" --force-recreate"
          fi
          cat > /tmp/deploy.sh << REMOTE_SCRIPT
          set -euo pipefail
          cd "$REMOTE_PATH"
          docker compose --env-file "$ENV_FILE" -f docker-compose.prod.yml pull api web
          docker compose --env-file "$ENV_FILE" -f docker-compose.prod.yml up -d --no-build${force} api web
          docker compose --env-file "$ENV_FILE" -f docker-compose.prod.yml ps api web
          REMOTE_SCRIPT
          ssh -i ~/.ssh/deploy_vps -o StrictHostKeyChecking=yes -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" 'bash -s' < /tmp/deploy.sh

      - name: Deploy automation profile and workflows
        if: ${{ inputs.deploy_automation }}
        run: |
          set -euo pipefail
          force=""
          if [[ "${{ inputs.force_recreate }}" == "true" ]]; then
            force=" --force-recreate"
          fi
          force_import="${{ inputs.force_automation_workflow_import }}"
          cat > /tmp/deploy_automation.sh << REMOTE_SCRIPT
          set -euo pipefail
          cd "$REMOTE_PATH"
          mkdir -p .deploy backups/n8n

          docker compose --env-file "$ENV_FILE" -f docker-compose.prod.yml --profile automation pull redis waha n8n whisper
          docker compose --env-file "$ENV_FILE" -f docker-compose.prod.yml --profile automation up -d --no-build${force} redis waha n8n whisper
          docker compose --env-file "$ENV_FILE" -f docker-compose.prod.yml --profile automation ps redis waha n8n whisper

          manifest=\$(find automation/export -maxdepth 1 -type f -name 'workflow-*.json' -print0 | sort -z | xargs -0 sha256sum)
          marker=.deploy/automation-workflows.sha256
          changed=1
          if [ "$force_import" != "true" ] && [ -f "\$marker" ] && printf '%s\n' "\$manifest" | cmp -s "\$marker" -; then
            changed=0
          fi

          if [ "\$changed" = "0" ]; then
            echo "Workflows n8n sem mudanca; import pulado."
            exit 0
          fi

          backup_name="backups/n8n/workflows-before-automation-deploy_\$(date +%Y%m%d_%H%M%S).json"
          active_ids_file=.deploy/n8n-active-workflows-before.txt
          : > "\$active_ids_file"
          if docker compose --env-file "$ENV_FILE" -f docker-compose.prod.yml --profile automation exec -T n8n n8n export:workflow --all --output=/tmp/workflows-before-automation-deploy.json; then
            docker compose --env-file "$ENV_FILE" -f docker-compose.prod.yml --profile automation exec -T n8n node -e "const fs=require('fs'); const raw=JSON.parse(fs.readFileSync('/tmp/workflows-before-automation-deploy.json','utf8')); const list=Array.isArray(raw)?raw:(Array.isArray(raw.data)?raw.data:(Array.isArray(raw.workflows)?raw.workflows:[raw])); for (const w of list) { if (w && w.id && (w.active===true || w.active==='true' || w.isActive===true)) console.log(w.id); }" > "\$active_ids_file" || true
            docker compose --env-file "$ENV_FILE" -f docker-compose.prod.yml --profile automation cp n8n:/tmp/workflows-before-automation-deploy.json "\$backup_name" || true
            echo "Backup workflows n8n: $REMOTE_PATH/\$backup_name"
          else
            echo "AVISO: nao consegui exportar backup dos workflows n8n; seguindo com import." >&2
          fi

          for wf in automation/export/workflow-*.json; do
            base=\$(basename "\$wf")
            docker compose --env-file "$ENV_FILE" -f docker-compose.prod.yml --profile automation cp "\$wf" "n8n:/tmp/\$base"
            docker compose --env-file "$ENV_FILE" -f docker-compose.prod.yml --profile automation exec -T n8n n8n import:workflow --input="/tmp/\$base"
          done

          {
            printf '%s\n' calendaromni0001 calendarchat0001 calendartrans001 omnichatmvp00001
            cat "\$active_ids_file"
          } | awk 'NF && !seen[\$0]++' | while IFS= read -r workflow_id; do
            docker compose --env-file "$ENV_FILE" -f docker-compose.prod.yml --profile automation exec -T n8n n8n update:workflow --id="\$workflow_id" --active=true
          done
          docker compose --env-file "$ENV_FILE" -f docker-compose.prod.yml --profile automation restart n8n

          printf '%s\n' "\$manifest" > "\$marker"
          echo "Workflows n8n importados e n8n reiniciado."
          REMOTE_SCRIPT
          ssh -i ~/.ssh/deploy_vps -o StrictHostKeyChecking=yes -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" 'bash -s' < /tmp/deploy_automation.sh

      - name: Smoke tests
        if: ${{ !inputs.skip_smoke_tests }}
        run: |
          set -euo pipefail
          cat > /tmp/smoke.sh << REMOTE_SCRIPT
          set -euo pipefail
          root=\$(curl -sS -o /dev/null -w "%{http_code}" "$PUBLIC_BASE_URL")
          health=\$(curl -sS -o /dev/null -w "%{http_code}" "$PUBLIC_BASE_URL/healthz")
          printf "GET %s => %s\n" "$PUBLIC_BASE_URL" "\$root"
          printf "GET %s/healthz => %s\n" "$PUBLIC_BASE_URL" "\$health"
          [ "\$root" = "200" ] && [ "\$health" = "200" ]
          REMOTE_SCRIPT
          ssh -i ~/.ssh/deploy_vps -o StrictHostKeyChecking=yes -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" 'bash -s' < /tmp/smoke.sh

      - name: Publish summary
        if: ${{ always() }}
        run: |
          {
            echo "## Deploy VPS (pull)"
            echo ""
            echo "- Ambiente: \`${{ inputs.environment }}\`"
            echo "- Imagem: \`$IMAGE_TAG\`"
            echo "- Host: \`$DEPLOY_HOST\`"
            echo "- Remote path: \`$REMOTE_PATH\`"
            echo "- Backup: \`${{ inputs.backup_database }}\`"
            echo "- Automation: \`${{ inputs.deploy_automation }}\`"
            echo "- A VPS nao buildou nada: pull do GHCR + up --no-build."
          } >> "$GITHUB_STEP_SUMMARY"
