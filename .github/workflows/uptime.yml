name: uptime

# Monitor externo: roda fora da VPS, entao detecta o caso de a maquina inteira
# (e o proprio monitor interno) cair. Sem segredos: so GITHUB_TOKEN.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: uptime
  cancel-in-progress: false

env:
  BASE_URL: https://omni.crowvisuals.com.br

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Checar healthz e home
        id: probe
        run: |
          failures=""
          check() {
            local name="$1" url="$2"
            if ! curl -fsS -o /dev/null --max-time 15 --retry 2 --retry-delay 5 --retry-all-errors "$url"; then
              failures="${failures}- ${name}: ${url}"$'\n'
            fi
          }
          check "healthz" "${BASE_URL}/healthz"
          check "home" "${BASE_URL}/"
          {
            echo "failed=$([ -n "$failures" ] && echo true || echo false)"
            echo "details<<EOF_DETAILS"
            printf '%s' "$failures"
            echo
            echo "EOF_DETAILS"
          } >> "$GITHUB_OUTPUT"

      - name: Garantir label uptime
        run: gh label create uptime --color B60205 --description "Monitor externo de uptime" 2>/dev/null || true

      - name: Falhou - abrir ou comentar issue
        if: steps.probe.outputs.failed == 'true'
        env:
          DETAILS: ${{ steps.probe.outputs.details }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          now="$(date -u +'%Y-%m-%d %H:%M UTC')"
          body="Falha em ${now}:"$'\n\n'"${DETAILS}"$'\n'"Execucao: ${RUN_URL}"
          existing="$(gh issue list --label uptime --state open --limit 1 --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --label uptime --title "Omni fora do ar (${now})" --body "$body"
          fi

      - name: Voltou - fechar issue aberta
        if: steps.probe.outputs.failed == 'false'
        run: |
          now="$(date -u +'%Y-%m-%d %H:%M UTC')"
          for n in $(gh issue list --label uptime --state open --limit 20 --json number --jq '.[].number'); do
            gh issue close "$n" --comment "voltou (${now}): healthz e home responderam."
          done
