# Compatibilidade local com Apple Silicon.
services:
  postgres:
    cpu_shares: 2048
    ports: !override
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
  # O front publico fica em outro repositorio; subir explicitamente quando clonado.
  crow-nuxt:
    profiles: ["bio"]
  waha:
    platform: linux/amd64
    ports: !override
      - "127.0.0.1:${AUTOMATION_WAHA_PORT:-3010}:3000"
  n8n:
    ports: !override
      - "127.0.0.1:${AUTOMATION_N8N_PORT:-5680}:5678"
  redis:
    ports: !override
      - "127.0.0.1:${AUTOMATION_REDIS_PORT:-6380}:6379"
  whisper:
    ports: !override
      - "127.0.0.1:${WHISPER_PORT:-8010}:8000"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/openapi.json', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
  meta-ads-assistant:
    ports: !override
      - "127.0.0.1:${META_ADS_ASSISTANT_PORT:-8765}:8765"
  api:
    ports: !reset []
    cpu_shares: 2048
    build:
      dockerfile: ../compose.mac-api.Dockerfile
    # A copia de producao nao executa seeds demo nem bootstrap ERP local.
    command: ["sh", "-c", "APP_ENV=production migrate up && exec api"]
    environment:
      R2_ENABLED: "false"
      # E-mail local vai para o Mailpit (captura tudo, nao entrega para fora):
      # caixa em http://localhost:8025. Banco local e copia de producao, entao
      # reset de senha e alertas NUNCA podem sair para e-mails reais daqui.
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_TLS_MODE: none
      SMTP_USERNAME: ""
      SMTP_PASSWORD: ""
      SMTP_FROM_EMAIL: alertas@omni.local
      SMTP_FROM_NAME: Omni local
      ERP_SYNC_AUTOMATIC_ENABLED: "false"
      META_ADS_WRITES_ENABLED: "false"
      OMNI_AI_EXECUTOR: native
      META_ADS_ASSISTANT_RUNNER_URL: http://meta-ads-assistant:8765
      # Originais privados (comprovantes, fontes) com R2 desligado: fora de /uploads,
      # que e publico. Volume proprio; nao altera os volumes existentes.
      PRIVATE_FILES_DIR: /app/data/private
    volumes:
      - api_private_files:/app/data/private
  obs-agent:
    build:
      dockerfile: ../compose.mac-api.Dockerfile
    # No Docker Desktop o "/" do container e o da VM (alguns MB); o disco real do
    # Mac aparece pelo bind do repositorio (virtiofs), somente leitura.
    environment:
      OBS_AGENT_DISK_PATHS: /host-mac=mac
    volumes:
      - ./:/host-mac:ro
  web:
    ports: !reset []
    # Prioridade de CPU no Docker Desktop: com o Mac carregado (builds Go, rebuild
    # de imagem, runner/Chrome), o nuxt dev precisa continuar servindo modulos; sem
    # isso ele ficava sem CPU, o proxy respondia 502 e as paginas travavam.
    cpu_shares: 4096
  mailpit:
    # SMTP de teste so do Mac: SMTP em mailpit:1025, caixa web em :8025.
    image: axllent/mailpit:v1.27.4
    restart: unless-stopped
    mem_limit: 128m
    ports:
      - "127.0.0.1:8025:8025"
    environment:
      MP_MAX_MESSAGES: "2000"
  local-access:
    image: omni-web
    pull_policy: never
    entrypoint: ["node", "/local-access-proxy.cjs"]
    restart: unless-stopped
    mem_limit: 128m
    cpu_shares: 2048
    ports:
      - "127.0.0.1:3003:3003"
      - "127.0.0.1:8080:8080"
    volumes:
      - ./compose.mac-proxy.cjs:/local-access-proxy.cjs:ro
    networks: [default, local_access]
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started

networks:
  default:
    # WhatsApp, modelos STT e integracoes precisam de saida para a internet.
    name: omni_local_services
  local_access:
    name: omni_local_access

volumes:
  api_private_files:
