name: ${COMPOSE_PROJECT_NAME:-omni}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - app

  api:
    # Imagem do registry (GHCR). IMAGE_TAG recebe o SHA do git (nao "latest"):
    # garante que o byte-a-byte testado em staging seja o promovido pra prod.
    # Fluxo de prod usa `pull` + `up --no-build`; a secao `build:` abaixo so
    # serve pra build local de emergencia/dev.
    image: ${API_IMAGE:-ghcr.io/mikewade2k16/omni-api}:${IMAGE_TAG:-latest}
    build:
      context: ./back
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      APP_NAME: ${APP_NAME:-omni-api}
      APP_ENV: production
      APP_ADDR: :8080
      CORE_V2_ENABLED: ${CORE_V2_ENABLED:-true}
      AUTOMATION_WAHA_INTERNAL_URL: ${AUTOMATION_WAHA_INTERNAL_URL:-http://waha:3000}
      # Sessao fisica unica da WAHA Core ("default", 1 numero). "@channel" = modo
      # por-conta, valido so com WAHA Plus (multi-sessao).
      AUTOMATION_WAHA_SESSION: ${AUTOMATION_WAHA_SESSION:-default}
      AUTOMATION_N8N_INTERNAL_URL: ${AUTOMATION_N8N_INTERNAL_URL:-http://n8n:5678}
      AUTOMATION_RUNTIME_TOKEN: ${AUTOMATION_RUNTIME_TOKEN}
      WEB_APP_URL: ${WEB_APP_URL}
      UPLOADS_DIR: /app/data/uploads
      # Absolutiza /uploads/* nas respostas publicas (cardapio/bio). Sem isso o
      # publico devolve caminho relativo e o front em outro dominio (ex.: TAVOLA
      # em mostarda.crowvisuals.com.br) nao acha a imagem. Ver DEPLOY_MOSTARDA_PROD.md.
      PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL:-}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      DATABASE_MIN_CONNS: ${DATABASE_MIN_CONNS:-0}
      DATABASE_MAX_CONNS: ${DATABASE_MAX_CONNS:-10}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      AUTH_TOKEN_SECRET: ${AUTH_TOKEN_SECRET}
      AUTH_TOKEN_TTL: ${AUTH_TOKEN_TTL:-12h}
      AUTH_INVITE_TTL: ${AUTH_INVITE_TTL:-168h}
      AUTH_PASSWORD_RESET_TTL: ${AUTH_PASSWORD_RESET_TTL:-30m}
      AUTH_ROLES_SOURCE: ${AUTH_ROLES_SOURCE:-core}
      # Cookie de sessao do gate SSO (Caddy forward_auth -> /v1/auth/gateway/verify).
      # Prod: .crowvisuals.com.br (cookie vale em omni./n8n./waha.). Ver SSO_GATEWAY_PLAN.md.
      AUTH_GATEWAY_COOKIE_DOMAIN: ${AUTH_GATEWAY_COOKIE_DOMAIN:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Omni}
      SMTP_TLS_MODE: ${SMTP_TLS_MODE:-starttls}
      SMTP_INSECURE_SKIP_VERIFY: ${SMTP_INSECURE_SKIP_VERIFY:-false}
      SMTP_TIMEOUT: ${SMTP_TIMEOUT:-10s}
      AUTH_BCRYPT_COST: ${AUTH_BCRYPT_COST:-10}
      AUTH_CONSULTANT_EMAIL_DOMAIN: ${AUTH_CONSULTANT_EMAIL_DOMAIN}
      AUTH_CONSULTANT_DEFAULT_PASSWORD: ${AUTH_CONSULTANT_DEFAULT_PASSWORD}
      ERP_SOURCE_KIND: ${ERP_SOURCE_KIND:-local}
      ERP_SOURCE_RECURSIVE: ${ERP_SOURCE_RECURSIVE:-false}
      ERP_SOURCE_DIR: ${ERP_SOURCE_DIR:-/app/data/erp/source}
      ERP_STORAGE_DIR: ${ERP_STORAGE_DIR:-/app/data/erp/storage}
      ERP_BOOTSTRAP_ITEM_FILE: ${ERP_BOOTSTRAP_ITEM_FILE:-consolidados/184/item_184_consolidado.md}
      ERP_BOOTSTRAP_CUSTOMER_FILE: ${ERP_BOOTSTRAP_CUSTOMER_FILE:-consolidados/184/customer_184_consolidado.md}
      ERP_BOOTSTRAP_EMPLOYEE_FILE: ${ERP_BOOTSTRAP_EMPLOYEE_FILE:-consolidados/184/employee_184_consolidado.md}
      ERP_BOOTSTRAP_ORDER_FILE: ${ERP_BOOTSTRAP_ORDER_FILE:-consolidados/184/order_184_consolidado.md}
      ERP_BOOTSTRAP_ORDER_CANCELED_FILE: ${ERP_BOOTSTRAP_ORDER_CANCELED_FILE:-consolidados/184/ordercanceled_184_consolidado.md}
      ERP_BOOTSTRAP_TENANT_ID: ${ERP_BOOTSTRAP_TENANT_ID:-}
      ERP_BOOTSTRAP_TENANT_SLUG: ${ERP_BOOTSTRAP_TENANT_SLUG:-}
      ERP_BOOTSTRAP_STORE_CODE: ${ERP_BOOTSTRAP_STORE_CODE:-184}
      ERP_BOOTSTRAP_STORE_NAME: ${ERP_BOOTSTRAP_STORE_NAME:-Loja 184}
      ERP_BOOTSTRAP_STORE_CITY: ${ERP_BOOTSTRAP_STORE_CITY:-}
      ERP_FTP_HOST: ${ERP_FTP_HOST:-}
      ERP_FTP_PORT: ${ERP_FTP_PORT:-0}
      ERP_FTP_USER: ${ERP_FTP_USER:-}
      ERP_FTP_PASSWORD: ${ERP_FTP_PASSWORD:-}
      ERP_FTP_KEY_PATH: ${ERP_FTP_KEY_PATH:-}
      ERP_FTP_REMOTE_DIR: ${ERP_FTP_REMOTE_DIR:-}
      ERP_FTP_HOST_KEY: ${ERP_FTP_HOST_KEY:-}
      ERP_ROOT_STORE_CODE: ${ERP_ROOT_STORE_CODE:-184}
      ERP_ALLOW_MANUAL_SYNC: ${ERP_ALLOW_MANUAL_SYNC:-false}
      ERP_SYNC_INTERVAL: ${ERP_SYNC_INTERVAL:-24h}
      ERP_SYNC_HOUR_UTC: ${ERP_SYNC_HOUR_UTC:-4}
      ERP_SYNC_AUTOMATIC_ENABLED: ${ERP_SYNC_AUTOMATIC_ENABLED:-false}
      ERP_SYNC_DRY_RUN_DEFAULT: ${ERP_SYNC_DRY_RUN_DEFAULT:-false}
      ERP_CSV_MAX_BYTES: ${ERP_CSV_MAX_BYTES:-134217728}
      ERP_MANUAL_SYNC_MAX_FILES: ${ERP_MANUAL_SYNC_MAX_FILES:-100}
      ERP_BACKFILL_MAX_FILES: ${ERP_BACKFILL_MAX_FILES:-1000}
      ERP_MANUAL_SYNC_MIN_INTERVAL: ${ERP_MANUAL_SYNC_MIN_INTERVAL:-5m}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${API_PORT:-18080}:8080"
    volumes:
      - api_uploads:/app/data/uploads
      - ${ERP_SOURCE_HOST_DIR:-./erp-source}:/app/data/erp/source:ro
      - api_erp_storage:/app/data/erp/storage
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl --fail --silent http://127.0.0.1:8080/healthz > /dev/null || exit 1"
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      app:
      proxy:
        aliases:
          - ${PROXY_API_ALIAS:-lista-api}

  web:
    # Imagem do registry (GHCR). Mesmo IMAGE_TAG (SHA) que a api: prod e staging
    # promovem o MESMO artefato. `build:` abaixo so pra build local de emergencia/dev.
    image: ${WEB_IMAGE:-ghcr.io/mikewade2k16/omni-web}:${IMAGE_TAG:-latest}
    build:
      context: ./web
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NUXT_PUBLIC_API_BASE: ${NUXT_PUBLIC_API_BASE}
      NUXT_PUBLIC_API_WS_BASE: ${NUXT_PUBLIC_API_WS_BASE:-}
      NUXT_API_INTERNAL_BASE: ${NUXT_API_INTERNAL_BASE:-http://api:8080}
      NITRO_HOST: 0.0.0.0
      PORT: 3003
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_PORT:-13003}:3003"
    networks:
      app:
      proxy:
        aliases:
          - ${PROXY_WEB_ALIAS:-lista-web}

  # ── Automacao WhatsApp/IA (n8n + WAHA + Redis) — profile "automation" ──
  # Sobe so com: docker compose -f docker-compose.prod.yml --profile automation up -d
  # Mesmos nomes de servico do dev (redis/waha/n8n) para o workflow e as credenciais
  # do n8n funcionarem igual local e prod (WAHA->n8n por http://n8n:5678; credencial
  # Redis host "redis"; WAHA host "http://waha:3000"). O Caddy (rede proxy) roteia o
  # editor do n8n e o dashboard da WAHA por subdominio com basic auth; o webhook
  # WAHA->n8n NUNCA sai da rede interna. O Redis fica so na rede "app" (nunca publico)
  # e ja disponivel para a API Go do Omni usar no futuro (redis:6379). Sem postgres
  # dedicado: a integracao com dados usa o Postgres do Omni por fase (PLANO A1+).
  # Runbook de deploy: docs/automation/SETUP.md secao 8.
  redis:
    image: redis:8-alpine
    profiles: ["automation"]
    restart: unless-stopped
    command: redis-server --requirepass ${AUTOMATION_REDIS_PASSWORD}
    volumes:
      - automation_redis:/data
    ports:
      - "127.0.0.1:${AUTOMATION_REDIS_PORT:-16380}:6379"
    networks:
      - app

  waha:
    image: devlikeapro/waha:gows-2026.5.1
    profiles: ["automation"]
    restart: unless-stopped
    environment:
      WHATSAPP_HOOK_URL: http://n8n:5678/webhook/webhook
      WHATSAPP_DEFAULT_ENGINE: GOWS
      WHATSAPP_HOOK_EVENTS: message
      WAHA_NO_API_KEY: "true"
      WAHA_DASHBOARD_USERNAME: ${AUTOMATION_WAHA_DASHBOARD_USER:-admin}
      WAHA_DASHBOARD_PASSWORD: ${AUTOMATION_WAHA_DASHBOARD_PASSWORD}
      WHATSAPP_SWAGGER_NO_PASSWORD: "true"
    volumes:
      - automation_waha_sessions:/app/.sessions
      - automation_waha_media:/app/.media
    ports:
      - "127.0.0.1:${AUTOMATION_WAHA_PORT:-13010}:3000"
    networks:
      app:
      proxy:
        aliases:
          - ${AUTOMATION_WAHA_PROXY_ALIAS:-automation-waha}

  n8n:
    image: n8nio/n8n:2.23.2
    profiles: ["automation"]
    restart: unless-stopped
    environment:
      N8N_HOST: ${AUTOMATION_N8N_HOST}
      N8N_PORT: 5678
      # http/false p/ acesso via tunel SSH (dev/bootstrap); default https/true p/ subdominio.
      N8N_PROTOCOL: ${AUTOMATION_N8N_PROTOCOL:-https}
      WEBHOOK_URL: ${AUTOMATION_N8N_WEBHOOK_URL}
      N8N_EDITOR_BASE_URL: ${AUTOMATION_N8N_WEBHOOK_URL}
      N8N_PROXY_HOPS: 1
      N8N_SECURE_COOKIE: ${AUTOMATION_N8N_SECURE_COOKIE:-true}
      N8N_ENCRYPTION_KEY: ${AUTOMATION_N8N_ENCRYPTION_KEY}
      GENERIC_TIMEZONE: America/Sao_Paulo
      N8N_LOG_LEVEL: info
      N8N_COMMUNITY_PACKAGES_ALLOW_TOOL_USAGE: "true"
      # Libera $env.* nas expressoes do n8n. Os workflows usam $env.AUTOMATION_RUNTIME_TOKEN
      # no header das tools (Omni Chat: "Buscar catalogo") e no runtime-config (WhatsApp).
      # Sem isso o n8n bloqueia e da "access to env vars denied". Espelha o dev.
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      AUTOMATION_RUNTIME_TOKEN: ${AUTOMATION_RUNTIME_TOKEN}
    volumes:
      - automation_n8n_data:/home/node/.n8n
    ports:
      - "127.0.0.1:${AUTOMATION_N8N_PORT:-15680}:5678"
    depends_on:
      - redis
    networks:
      app:
      proxy:
        aliases:
          - ${AUTOMATION_N8N_PROXY_ALIAS:-automation-n8n}

volumes:
  postgres_data:
  api_uploads:
  api_erp_storage:
  automation_redis:
  automation_waha_sessions:
  automation_waha_media:
  automation_n8n_data:

networks:
  app:
  proxy:
    external: true
    name: ${PROXY_NETWORK_NAME:-omnichannel-mvp_default}
