name: ${COMPOSE_PROJECT_NAME:-omni}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    mem_limit: 1g
    mem_reservation: 256m
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-omni}
      POSTGRES_USER: ${POSTGRES_USER:-omni}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-omni_dev}
      # AC-04: role de runtime least-privilege criada no init do volume (10-app-role.sh).
      APP_DB_ROLE: ${APP_DB_ROLE:-omni_app}
      APP_DB_ROLE_PASSWORD: ${APP_DB_ROLE_PASSWORD:-omni_app_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/db:/scripts/db:ro
      - ./scripts/db/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-omni} -d ${POSTGRES_DB:-omni}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build:
      context: ./back
      dockerfile: Dockerfile
    restart: unless-stopped
    mem_limit: 512m
    mem_reservation: 128m
    env_file:
      - path: ./back/.env
        required: false
    environment:
      APP_NAME: omni-api
      APP_ENV: docker
      APP_ADDR: :8080
      WEB_APP_URL: ${WEB_APP_URL:-http://localhost:3003}
      UPLOADS_DIR: /app/data/uploads
      R2_ENABLED: ${R2_ENABLED:-false}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_BUCKET: ${R2_BUCKET:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_REQUEST_TIMEOUT: ${R2_REQUEST_TIMEOUT:-30s}
      R2_UPLOAD_TIMEOUT: ${R2_UPLOAD_TIMEOUT:-15m}
      R2_ANALYTICS_API_TOKEN: ${R2_ANALYTICS_API_TOKEN:-}
      R2_ALLOW_NONEMPTY_BUCKET_INITIALIZATION: ${R2_ALLOW_NONEMPTY_BUCKET_INITIALIZATION:-false}
      # Base do back acessivel PELO BROWSER; absolutiza a midia /uploads/... no
      # endpoint publico (bio/cardapio). Sem ela, a midia enviada pelo painel sai
      # relativa e quebra no front (que roda em outro dominio). Em prod = dominio da api.
      PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL:-http://localhost:9091}
      # Base absoluta dos links curtos/QR do modulo tools (shortUrl = {base}/s/{slug}).
      # Vazio = usa PUBLIC_API_BASE_URL (localhost:9091 em dev).
      TOOLS_PUBLIC_BASE_URL: ${TOOLS_PUBLIC_BASE_URL:-}
      DATABASE_URL: postgres://${POSTGRES_USER:-omni}:${POSTGRES_PASSWORD:-omni_dev}@postgres:5432/${POSTGRES_DB:-omni}?sslmode=disable
      # AC-04: URL de RUNTIME da api (role least-privilege omni_app; sem DDL).
      # O binario migrate continua com DATABASE_URL (privilegiada, roda DDL).
      DATABASE_APP_URL: postgres://${APP_DB_ROLE:-omni_app}:${APP_DB_ROLE_PASSWORD:-omni_app_dev}@postgres:5432/${POSTGRES_DB:-omni}?sslmode=disable
      DATABASE_MIN_CONNS: ${DATABASE_MIN_CONNS:-0}
      DATABASE_MAX_CONNS: ${DATABASE_MAX_CONNS:-10}
      MIGRATION_TIMEOUT: ${MIGRATION_TIMEOUT:-5m}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:*,http://127.0.0.1:*,http://[::1]:*}
      CORE_V2_ENABLED: ${CORE_V2_ENABLED:-true}
      # Modulo automation: base interna da WAHA (rede do compose). So usada quando
      # o profile automation esta no ar; senao o painel cai no ultimo status salvo.
      AUTOMATION_WAHA_INTERNAL_URL: ${AUTOMATION_WAHA_INTERNAL_URL:-http://waha:3000}
      # Sessao fisica da WAHA usada no Conectar/Status/Logout/QR. A WAHA Core so
      # aceita "default" (1 numero por instancia) e todas as contas compartilham
      # essa sessao. "@channel" volta ao modo 1-sessao-por-conta (so com WAHA Plus).
      AUTOMATION_WAHA_SESSION: ${AUTOMATION_WAHA_SESSION:-default}
      # Omni Chat (M0): base interna do n8n (rede do compose) p/ o webhook
      # POST /webhook/omni-chat. So usada quando o profile automation esta no ar.
      AUTOMATION_N8N_INTERNAL_URL: ${AUTOMATION_N8N_INTERNAL_URL:-http://n8n:5678}
      # Token de servico que o n8n usa no GET /v1/runtime/automation/config (M2) e
      # que a api usa no Bearer Go->n8n do Omni Chat (M0). Deve bater com o
      # AUTOMATION_RUNTIME_TOKEN do servico n8n.
      AUTOMATION_RUNTIME_TOKEN: ${AUTOMATION_RUNTIME_TOKEN:-dev-automation-runtime-token}
      # Calendario (agenda de conteudo) — IA por n8n. Plano do mes (Fase 6): webhook
      # do n8n + token de servico do callback + base da api que o n8n chama de volta.
      # Vazios => POST /v1/calendar/ai/plan responde 503 ai_not_configured.
      CALENDAR_AI_WEBHOOK_URL: ${CALENDAR_AI_WEBHOOK_URL:-}
      CALENDAR_AI_SERVICE_TOKEN: ${CALENDAR_AI_SERVICE_TOKEN:-}
      CALENDAR_AI_CALLBACK_BASE: ${CALENDAR_AI_CALLBACK_BASE:-http://api:8080}
      # Chat flutuante + voz (C7/C8): webhooks do n8n (proxy fino Go->n8n). Vazios =>
      # /v1/calendar/chat/ask responde 503 chat_not_configured e /chat/transcribe
      # responde 503 transcribe_not_configured. Ex. (profile automation no ar):
      # http://n8n:5678/webhook/calendar-chat e .../calendar-transcribe.
      CALENDAR_CHAT_WEBHOOK_URL: ${CALENDAR_CHAT_WEBHOOK_URL:-}
      CALENDAR_TRANSCRIBE_WEBHOOK_URL: ${CALENDAR_TRANSCRIBE_WEBHOOK_URL:-}
      # Modulo meta_ads: base da Graph/Marketing API da Meta (bump de versao via env).
      META_ADS_GRAPH_BASE: ${META_ADS_GRAPH_BASE:-https://graph.facebook.com/v24.0}
      # Kill switch do executor confirmado. Default false: propostas/auditoria
      # funcionam, mas nenhuma mutacao e enviada a Graph.
      META_ADS_WRITES_ENABLED: ${META_ADS_WRITES_ENABLED:-false}
      # Chave simetrica (pgcrypto) p/ cifrar o System User token at-rest. SEM ela,
      # conectar a Meta retorna 503. Definir um valor forte no .env (NAO commitar).
      META_ADS_CRYPTO_KEY: ${META_ADS_CRYPTO_KEY:-}
      # Facebook Login de primeira parte do dashboard. Vazios mantem somente o
      # fallback manual; /oauth/start responde 503 sem expor segredo.
      META_ADS_APP_ID: ${META_ADS_APP_ID:-}
      META_ADS_APP_SECRET: ${META_ADS_APP_SECRET:-}
      META_ADS_OAUTH_REDIRECT_URL: ${META_ADS_OAUTH_REDIRECT_URL:-}
      # Runner MCP legado/read-only, sem rota publica de chat e sem writes.
      # Compatibilidade interna fora do produto/producao; o Assistente 360 usa
      # /v1/assistant/chat e o executor confirmado usa Graph first-party em Go.
      META_ADS_ASSISTANT_RUNNER_URL: ${META_ADS_ASSISTANT_RUNNER_URL:-http://host.docker.internal:8765}
      # Token de servico do runner. Deve bater com o META_ADS_ASSISTANT_TOKEN
      # usado pelo runner (host ou servico meta-ads-assistant).
      META_ADS_ASSISTANT_TOKEN: ${META_ADS_ASSISTANT_TOKEN:-dev-meta-assistant-token}
      # Bearer do bridge interno (/internal/meta-ads/runner/*) que o runner usa
      # p/ buscar postagens do Instagram via api Go. Vazio = bridge desligado (503).
      META_ADS_RUNNER_BRIDGE_TOKEN: ${META_ADS_RUNNER_BRIDGE_TOKEN:-dev-meta-bridge-token}
      AUTH_TOKEN_SECRET: ${AUTH_TOKEN_SECRET:-dev-secret-change-me}
      AUTH_TOKEN_TTL: ${AUTH_TOKEN_TTL:-12h}
      AUTH_INVITE_TTL: ${AUTH_INVITE_TTL:-168h}
      AUTH_PASSWORD_RESET_TTL: ${AUTH_PASSWORD_RESET_TTL:-30m}
      # Dominio do cookie de sessao do gate SSO (Caddy forward_auth libera n8n./waha.
      # com o login do Omni). Vazio em dev (sem subdominio/Caddy). Prod: .crowvisuals.com.br.
      AUTH_GATEWAY_COOKIE_DOMAIN: ${AUTH_GATEWAY_COOKIE_DOMAIN:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Omni}
      SMTP_TLS_MODE: ${SMTP_TLS_MODE:-starttls}
      SMTP_INSECURE_SKIP_VERIFY: ${SMTP_INSECURE_SKIP_VERIFY:-false}
      SMTP_TIMEOUT: ${SMTP_TIMEOUT:-10s}
      AUTH_BCRYPT_COST: ${AUTH_BCRYPT_COST:-10}
      ERP_SOURCE_KIND: ${ERP_SOURCE_KIND:-local}
      ERP_SOURCE_RECURSIVE: ${ERP_SOURCE_RECURSIVE:-false}
      ERP_SOURCE_DIR: /app/data/erp/source
      ERP_STORAGE_DIR: /app/data/erp/storage
      ERP_BOOTSTRAP_ITEM_FILE: ${ERP_BOOTSTRAP_ITEM_FILE:-consolidados/184/item_184_consolidado.md}
      ERP_FTP_HOST: ${ERP_FTP_HOST:-}
      ERP_FTP_PORT: ${ERP_FTP_PORT:-0}
      ERP_FTP_USER: ${ERP_FTP_USER:-}
      ERP_FTP_PASSWORD: ${ERP_FTP_PASSWORD:-}
      ERP_FTP_KEY_PATH: ${ERP_FTP_KEY_PATH:-}
      ERP_FTP_REMOTE_DIR: ${ERP_FTP_REMOTE_DIR:-}
      ERP_FTP_HOST_KEY: ${ERP_FTP_HOST_KEY:-}
      ERP_ROOT_STORE_CODE: ${ERP_ROOT_STORE_CODE:-184}
      ERP_ALLOW_MANUAL_SYNC: ${ERP_ALLOW_MANUAL_SYNC:-true}
      ERP_SYNC_INTERVAL: ${ERP_SYNC_INTERVAL:-24h}
      ERP_SYNC_HOUR_UTC: ${ERP_SYNC_HOUR_UTC:-4}
      ERP_SYNC_AUTOMATIC_ENABLED: ${ERP_SYNC_AUTOMATIC_ENABLED:-false}
      ERP_SYNC_DRY_RUN_DEFAULT: ${ERP_SYNC_DRY_RUN_DEFAULT:-false}
      ERP_CSV_MAX_BYTES: ${ERP_CSV_MAX_BYTES:-134217728}
      ERP_MANUAL_SYNC_MAX_FILES: ${ERP_MANUAL_SYNC_MAX_FILES:-100}
      ERP_BACKFILL_MAX_FILES: ${ERP_BACKFILL_MAX_FILES:-1000}
      ERP_MANUAL_SYNC_MIN_INTERVAL: ${ERP_MANUAL_SYNC_MIN_INTERVAL:-5m}
      # Modulo omnichannel (Atendimento WhatsApp). Chave AES-256 (32 bytes em base64,
      # `openssl rand -base64 32`) p/ cifrar credenciais de instancia EM REPOUSO
      # (platform/secretbox). OBRIGATORIA a partir da F3.5: sem ela a api NAO SOBE
      # (fail-fast no boot, sem default). Perder a chave = perder os segredos cifrados.
      OMNI_SECRETS_KEY: ${OMNI_SECRETS_KEY:-}
      CUSTOMER_DATA_ENCRYPTION_KEY: ${CUSTOMER_DATA_ENCRYPTION_KEY:-}
      CUSTOMER_DATA_HMAC_KEY: ${CUSTOMER_DATA_HMAC_KEY:-}
      # Storage privado do inbox. Fica fora de /uploads e so e servido por rota autenticada.
      OMNICHANNEL_MEDIA_DIR: ${OMNICHANNEL_MEDIA_DIR:-/app/data/media/omnichannel}
      # Audio privado dos atendimentos experimentais; nunca exposto pelo /uploads.
      ATTENDANCE_AUDIO_DIR: ${ATTENDANCE_AUDIO_DIR:-/app/data/media/attendance-audio}
      ATTENDANCE_TRANSCRIPTION_BASE_URL: ${ATTENDANCE_TRANSCRIPTION_BASE_URL:-http://whisper:8000}
      ATTENDANCE_TRANSCRIPTION_MODEL: ${ATTENDANCE_TRANSCRIPTION_MODEL:-Systran/faster-whisper-base}
      ATTENDANCE_TRANSCRIPTION_LANGUAGE: ${ATTENDANCE_TRANSCRIPTION_LANGUAGE:-pt}
      ATTENDANCE_TRANSCRIPTION_TIMEOUT: ${ATTENDANCE_TRANSCRIPTION_TIMEOUT:-10m}
      ATTENDANCE_ANALYSIS_WEBHOOK_URL: ${ATTENDANCE_ANALYSIS_WEBHOOK_URL:-http://n8n:5678/webhook/queue-attendance-analysis}
      ATTENDANCE_ANALYSIS_TIMEOUT: ${ATTENDANCE_ANALYSIS_TIMEOUT:-20m}
      # Cerebro configuravel: `native` (rollback) ou `n8n`. O n8n nunca envia ao canal;
      # devolve JSON ao Go, que valida e controla estado/outbox.
      OMNI_AI_EXECUTOR: ${OMNI_AI_EXECUTOR:-native}
      OMNI_N8N_BRAIN_WEBHOOK_URL: ${OMNI_N8N_BRAIN_WEBHOOK_URL:-}
      OMNI_N8N_MEDIA_WEBHOOK_URL: ${OMNI_N8N_MEDIA_WEBHOOK_URL:-}
      OMNI_N8N_INTERNAL_TOKEN: ${OMNI_N8N_INTERNAL_TOKEN:-}
      OMNI_INTERNAL_API_BASE_URL: ${OMNI_INTERNAL_API_BASE_URL:-http://api:8080}
      # Provider Evolution (1o adapter real do canal). A api Go fala com a Evolution
      # pela rede interna do compose. Credencial REAL e por instancia (cifrada); estes
      # dois sao FALLBACK DE AMBIENTE apenas (canonico §13). Vazios = so o provider
      # `mock` funciona (destrava F5/F6/F8 sem numero real).
      EVOLUTION_BASE_URL: ${EVOLUTION_BASE_URL:-http://evolution:8080}
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY:-}
      # Provider default do bootstrap quando o front nao envia (o inbox verbatim e
      # Evolution-only e nao conhece o conceito). Default do codigo = mock; setar
      # `evolution` (ou o oficial na F11) para testar/produzir com numero real. A escolha
      # REAL por conta/numero (D-A) mora em whatsapp_instances.provider / F10.
      OMNI_DEFAULT_WHATSAPP_PROVIDER: ${OMNI_DEFAULT_WHATSAPP_PROVIDER:-}
      # URL que o provider chama de volta no webhook inbound
      # (POST /v1/webhooks/omnichannel/{provider}/{accountSlug}). Em dev a Evolution
      # (container) alcanca a api pela rede interna: http://api:8080. Em prod = dominio
      # publico da api (por onde o Caddy roteia /v1/webhooks/*).
      WEBHOOK_RECEIVER_BASE_URL: ${WEBHOOK_RECEIVER_BASE_URL:-http://api:8080}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${API_PORT:-8080}:8080"
    # Necessario p/ o api alcancar o agent-runner rodando no HOST (Linux/VPS
    # nao resolve host.docker.internal sem isso; em Docker Desktop e inocuo).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - api_uploads:/app/data/uploads
      - api_omnichannel_media:/app/data/media/omnichannel
      - api_attendance_audio:/app/data/media/attendance-audio
      - "./erp-source-local:/app/data/erp/source:ro"
      - api_erp_storage:/app/data/erp/storage
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl --fail --silent http://127.0.0.1:8080/healthz > /dev/null || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # DEV: o codigo NAO e mais bind mount (./web:/app) — ele vive DENTRO do
  # container (copiado no build) e as edicoes do host sao sincronizadas pelo
  # `docker compose watch`. Motivo: bind mount de caminho Windows atravessa a
  # ponte 9P do WSL2 (~100x mais lento por arquivo); o nuxt dev varre milhares
  # de arquivos e o boot/troca de pagina levava minutos. Com o codigo em
  # overlayfs nativo + sync, boot e HMR ficam em velocidade normal e o watcher
  # usa inotify de verdade (sem polling).
  #
  # COMO RODAR O DEV DO WEB:  docker compose watch web   (ou scripts/dev/watch-web.ps1)
  # `docker compose up -d web` sozinho SOBE o servidor mas NAO sincroniza
  # edicoes — a pagina fica "congelada" no codigo do ultimo build/sync.
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      target: dev
    command: sh -c "node ./scripts/ensure-node-modules.mjs && exec npm run dev"
    restart: unless-stopped
    # mem 4g: nuxt dev + Vite compilam no container (heap do build ja e 4096MB)
    mem_limit: 4g
    mem_reservation: 512m
    environment:
      NODE_ENV: development
      # Node dimensiona o heap pelo RAM do HOST (nao respeita o cgroup de 4g);
      # limitar o old-space evita o kernel matar o container por OOM no warmup.
      NODE_OPTIONS: --max-old-space-size=3072
      NUXT_PUBLIC_API_BASE: ${NUXT_PUBLIC_API_BASE:-http://localhost:8080}
      NUXT_API_INTERNAL_BASE: ${NUXT_API_INTERNAL_BASE:-http://api:8080}
      # Base do front bio publico (crow-nuxt); link "Ver bio" do painel -> {base}/bio/{slug}.
      # Em dev o crow-nuxt roda em localhost:3300 (porta nao-padrao). Em prod, setar o dominio real.
      NUXT_PUBLIC_BIO_FRONT_URL: ${NUXT_PUBLIC_BIO_FRONT_URL:-http://localhost:3300}
      NITRO_HOST: 0.0.0.0
      PORT: 3003
      NUXT_DEVTOOLS: ${NUXT_DEVTOOLS:-false}
      # Polling DESLIGADO: com o codigo no filesystem do container, o inotify
      # funciona (o sync do compose watch gera eventos reais). Ligar polling
      # aqui so queima CPU — era necessario apenas na era do bind mount.
      CHOKIDAR_USEPOLLING: ${CHOKIDAR_USEPOLLING:-false}
      CHOKIDAR_INTERVAL: ${CHOKIDAR_INTERVAL:-350}
      WATCHPACK_POLLING: ${WATCHPACK_POLLING:-false}
      # PWA-01: SW de dev e opt-in para nao interferir no HMR normal.
      NUXT_PWA_ENABLED: ${NUXT_PWA_ENABLED:-false}
      NUXT_PWA_DEV: ${NUXT_PWA_DEV:-false}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-3003}:3003"
    volumes:
      - web_node_modules:/app/node_modules
      - web_nuxt:/app/.nuxt
    develop:
      watch:
        # Mudou dependencia: sync + restart do container — o ensure-node-modules
        # roda de novo no boot e faz `npm ci` no volume (nao precisa rebuild).
        - action: sync+restart
          path: ./web/package.json
          target: /app/package.json
        - action: sync+restart
          path: ./web/package-lock.json
          target: /app/package-lock.json
        # Todo o resto do codigo: copia incremental host -> container.
        - action: sync
          path: ./web
          target: /app
          ignore:
            - node_modules/
            - .nuxt/
            - .output/
            - dist/
            - coverage/
            - "*.log"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3003/').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s

  # crow-nuxt — front publico da bio (BUILD DE PRODUCAO, leve). Serve as bios
  # publicadas E o /bio/preview que o painel embute no iframe do editor. Como
  # SERVICO (restart: unless-stopped) sobe junto e reinicia sozinho — antes era
  # processo manual (`npm run dev`) que morria e deixava o preview do editor em
  # tela preta / carregando infinito. Host 3300 (porta nao-padrao) = mesmo de
  # NUXT_PUBLIC_BIO_FRONT_URL. Idle leve (~31MB); render so quando o editor pede.
  #
  # ATENCAO DEPLOY/VPS: este servico e SO PARA O DEV LOCAL (preview do editor).
  # NAO subir o crow-nuxt no deploy a partir deste compose — o front bio tera o
  # container/deploy proprio dele (a definir). Na VPS, apontar NUXT_PUBLIC_BIO_FRONT_URL
  # para o dominio real do front bio e NAO incluir 'crow-nuxt' no `docker compose up`.
  crow-nuxt:
    build:
      context: ../crow-nuxt
    restart: unless-stopped
    mem_limit: 512m
    mem_reservation: 64m
    environment:
      NODE_ENV: production
      NITRO_HOST: 0.0.0.0
      NITRO_PORT: "3000"
      # server-side: crow-nuxt -> api do painel pela rede interna do compose (api:8080).
      NUXT_API_BASE: ${CROW_NUXT_API_BASE:-http://api:8080/v1/public}
      # browser-side (SSE da bio publica): host-mapeado.
      NUXT_PUBLIC_STREAM_BASE: ${NUXT_PUBLIC_STREAM_BASE:-http://localhost:9091/v1/public}
    ports:
      # host:container — porta nao-padrao no host (3300); dentro do container e 3000.
      - "${CROW_NUXT_PORT:-3300}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      api:
        condition: service_healthy

  # Automacao WhatsApp/IA (n8n + WAHA + Redis) — modulo automation/.
  # Sobe so com `docker compose --profile automation up -d` (fica fora do dev normal).
  # Mesma rede do projeto: WAHA fala com o n8n por http://n8n:5678; o n8n alcanca
  # o postgres do Omni por postgres:5432 (integracao CRM/Etapa 2, ainda futura).
  # Runbook completo em docs/automation/SETUP.md.
  redis:
    image: redis:8-alpine
    profiles: ["automation"]
    restart: unless-stopped
    mem_limit: 256m
    mem_reservation: 32m
    command: redis-server --requirepass ${AUTOMATION_REDIS_PASSWORD:-default}
    environment:
      REDIS_PASSWORD: ${AUTOMATION_REDIS_PASSWORD:-default}
    ports:
      - "${AUTOMATION_REDIS_PORT:-6380}:6379"
    volumes:
      - automation_redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  waha:
    image: devlikeapro/waha:gows-2026.7.1
    profiles: ["automation"]
    restart: unless-stopped
    mem_limit: ${AUTOMATION_WAHA_MEMORY_LIMIT:-2g}
    mem_reservation: 256m
    environment:
      WHATSAPP_HOOK_URL: http://n8n:5678/webhook/webhook
      WHATSAPP_DEFAULT_ENGINE: GOWS
      WHATSAPP_HOOK_EVENTS: message
      WHATSAPP_RESTART_ALL_SESSIONS: "true"
      WAHA_AUTO_START_DELAY_SECONDS: "1"
      WAHA_SESSION_CONFIG_IGNORE_STATUS: ${AUTOMATION_WAHA_IGNORE_STATUS:-true}
      WAHA_NO_API_KEY: "true"
      WAHA_DASHBOARD_NO_PASSWORD: "true"
      WHATSAPP_SWAGGER_NO_PASSWORD: "true"
    volumes:
      - automation_waha_sessions:/app/.sessions
      - automation_waha_media:/app/.media
    ports:
      - "${AUTOMATION_WAHA_PORT:-3010}:3000"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          boot=$$(awk '{print $$22}' /proc/1/stat);
          if curl --fail --silent --max-time 5 http://127.0.0.1:3000/ping > /dev/null; then
            echo "$$boot" > /tmp/waha-health-ready;
            rm -f /tmp/waha-health-failures;
            exit 0;
          fi;
          ready=$$(cat /tmp/waha-health-ready 2>/dev/null || true);
          [ "$$ready" = "$$boot" ] || exit 1;
          failures=$$(cat /tmp/waha-health-failures 2>/dev/null || echo 0);
          failures=$$((failures + 1));
          echo "$$failures" > /tmp/waha-health-failures;
          if [ "$$failures" -ge 3 ]; then kill -TERM 1; fi;
          exit 1
      interval: 20s
      timeout: 8s
      retries: 3
      start_period: 90s
    # Ordena so o boot (WAHA posta webhooks no n8n). service_started, nao _healthy:
    # a WAHA (QR/dashboard) precisa subir mesmo se o n8n estiver quebrado.
    depends_on:
      n8n:
        condition: service_started

  n8n:
    image: n8nio/n8n:2.23.2
    profiles: ["automation"]
    restart: unless-stopped
    mem_limit: 768m
    mem_reservation: 192m
    environment:
      N8N_HOST: localhost
      WEBHOOK_URL: http://localhost:${AUTOMATION_N8N_PORT:-5680}
      GENERIC_TIMEZONE: America/Sao_Paulo
      N8N_LOG_LEVEL: debug
      N8N_SECURE_COOKIE: "false"
      N8N_COMMUNITY_PACKAGES_ALLOW_TOOL_USAGE: "true"
      # Libera $env.* em expressoes do n8n (necessario para o AUTOMATION_RUNTIME_TOKEN
      # chegar ao no "Get runtime config" sem "access to env vars denied").
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      # Token de servico p/ o workflow ler o runtime-config da API ($env no n8n).
      AUTOMATION_RUNTIME_TOKEN: ${AUTOMATION_RUNTIME_TOKEN:-dev-automation-runtime-token}
      # API keys dos providers de IA do calendario (chat). Ficam SO aqui no n8n via $env;
      # nunca no config lido pelo front, nunca no git (.env e gitignored). O workflow
      # Calendar Chat le $env[keyEnv] conforme o provider escolhido no painel (gemini|glm).
      CALENDAR_GEMINI_API_KEY: ${CALENDAR_GEMINI_API_KEY:-}
      CALENDAR_ZAI_API_KEY: ${CALENDAR_ZAI_API_KEY:-}
      # Omnichannel Brain: somente token interno e URL do gateway Go; nenhuma chave de provider.
      OMNI_N8N_INTERNAL_TOKEN: ${OMNI_N8N_INTERNAL_TOKEN:-}
      OMNI_LLM_GATEWAY_URL: ${OMNI_LLM_GATEWAY_URL:-http://api:8080/v1/runtime/omnichannel/llm-gateway}
      OMNI_MEDIA_GATEWAY_URL: ${OMNI_MEDIA_GATEWAY_URL:-http://api:8080/v1/runtime/omnichannel/media}
    volumes:
      - automation_n8n_data:/home/node/.n8n
    ports:
      - "${AUTOMATION_N8N_PORT:-5680}:5678"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:5678/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    depends_on:
      redis:
        condition: service_healthy

  # Whisper self-hosted (STT do calendario). OpenAI-compatible: POST /v1/audio/transcriptions.
  # Aceita o audio do navegador (webm/opus) — decodifica via ffmpeg interno; NAO precisa de key.
  # O n8n (workflow calendar-transcribe, ramo "local") bate em http://whisper:8000. CPU, modelo
  # base (troque WHISPER__MODEL por small/medium para mais qualidade). Sobe no profile automation.
  whisper:
    image: fedirz/faster-whisper-server:latest-cpu
    container_name: omni-whisper
    profiles: ["automation"]
    restart: unless-stopped
    mem_limit: 3g
    environment:
      WHISPER__MODEL: ${WHISPER_MODEL:-Systran/faster-whisper-base}
      WHISPER__INFERENCE_DEVICE: cpu
      WHISPER__COMPUTE_TYPE: int8
      # Mantem o modelo SEMPRE carregado (padrao descarrega em 5min ocioso e recarrega ~3s
      # no proximo audio). -1 = nunca descarrega -> transcricao sempre rapida (~1s). Usa
      # todos os cores da CPU (cpu_threads=0 = auto). Trocar model por small/medium = +qualidade.
      WHISPER__TTL: "-1"
      WHISPER__CPU_THREADS: "0"
    volumes:
      - automation_whisper_cache:/root/.cache/huggingface
    ports:
      - "${WHISPER_PORT:-8010}:8000"

  # Runner legado/read-only de compatibilidade interna. Este profile e opcional
  # apenas para diagnostico local do legado; nao integra o produto, nao executa
  # writes e fica deliberadamente fora do compose de producao.
  # Credenciais tenant-scoped do legado persistem no volume /app/.auth.
  meta-ads-assistant:
    build:
      context: ./meta-ads-assistant
      dockerfile: Dockerfile
    profiles: ["meta-ads-assistant"]
    restart: unless-stopped
    mem_limit: 512m
    mem_reservation: 64m
    environment:
      META_ADS_ASSISTANT_PORT: 8765
      META_ADS_ASSISTANT_TOKEN: ${META_ADS_ASSISTANT_TOKEN:-dev-meta-assistant-token}
      META_ADS_ASSISTANT_TIMEOUT_MS: ${META_ADS_ASSISTANT_TIMEOUT_MS:-120000}
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
    ports:
      - "${META_ADS_ASSISTANT_PORT:-8765}:8765"
    volumes:
      - meta_ads_assistant_auth:/app/.auth
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8765/healthz?accountId=00000000-0000-4000-8000-000000000000',{headers:{Authorization:'Bearer '+process.env.META_ADS_ASSISTANT_TOKEN}}).then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  # Provider Evolution API (modulo omnichannel — Atendimento WhatsApp, F4).
  # 1o adapter real do canal (a decisao D-A do canonico e multi-provider; o `mock`
  # roda sem este container). Sobe SO com `docker compose --profile omnichannel up -d`
  # (fica fora do dev normal). Guia de subida/pareamento: docs/omnichannel/EVOLUTION_SETUP.md.
  #
  # ATENCAO VERSAO: confirmar a tag da imagem oficial antes de subir em prod
  # (o projeto publica em atendai/evolution-api e, mais recente, evoapicloud/evolution-api).
  # Pinado numa v2 estavel; NAO usar `latest` (Evolution v2 mudou envs vs v1).
  evolution:
    image: evoapicloud/evolution-api:v2.3.7 # v2.3.7 = versao do omni antigo (whats-test) que PAREAVA local; v2.2.3/v2.1.1 davam timeout no handshake WA (validateConnection)
    profiles: ["omnichannel"]
    restart: unless-stopped
    mem_limit: 1g
    mem_reservation: 256m
    environment:
      SERVER_TYPE: http
      SERVER_PORT: "8080"
      # URL que a propria Evolution usa p/ montar links (QR/midia). Rede interna do compose.
      SERVER_URL: ${EVOLUTION_BASE_URL:-http://evolution:8080}
      # Versao do WhatsApp Web que o Baileys ANUNCIA no handshake. SEM ISTO o WhatsApp
      # rejeita/trava a conexao (o "Timed Out at validateConnection" que impedia o QR local).
      # Valor herdado do omni antigo (whats-test) que pareava local. ATUALIZAR quando o WA
      # deprecar a versao (sintoma = QR volta a nao gerar). Ver docs/omnichannel/ESTADO.md.
      CONFIG_SESSION_PHONE_VERSION: ${EVOLUTION_CONFIG_SESSION_PHONE_VERSION:-2,3000,1025205472}
      # Chave mestra de autenticacao (header `apikey`). A api Go a envia em toda chamada
      # de sessao/envio. Gerar valor FORTE no .env; NAO commitar o .env real.
      AUTHENTICATION_TYPE: apikey
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:-change-me-evolution-api-key}
      # Banco DEDICADO (nao e o postgres do Omni — isolamento por design: o modulo
      # nao compartilha schema com ninguem). A Evolution roda as proprias migrations
      # Prisma no boot contra este banco.
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evolution:${EVOLUTION_DB_PASSWORD:-evolution_dev}@evolution-db:5432/evolution?schema=public
      DATABASE_CONNECTION_CLIENT_NAME: evolution_omni
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "true"
      DATABASE_SAVE_MESSAGE_UPDATE: "true"
      DATABASE_SAVE_DATA_CONTACTS: "true"
      DATABASE_SAVE_DATA_CHATS: "true"
      # Cache LOCAL (sem Redis): mantem o profile omnichannel autossuficiente, sem
      # acoplar ao Redis do profile automation.
      CACHE_REDIS_ENABLED: "false"
      CACHE_LOCAL_ENABLED: "true"
      # Webhook GLOBAL desligado de proposito: a URL de callback e setada POR INSTANCIA
      # pela api Go (setWebhook), apontando p/ /v1/webhooks/omnichannel/evolution/{slug}.
      WEBHOOK_GLOBAL_ENABLED: "false"
      # Logs enxutos; nunca logar payload cru (canonico §10).
      LOG_LEVEL: ${EVOLUTION_LOG_LEVEL:-ERROR}
      LOG_BAILEYS: error
    volumes:
      - evolution_instances:/evolution/instances
    ports:
      # Bind so em 127.0.0.1: o painel le o QR PELA api Go, nao direto. A porta no host
      # e SO p/ troubleshooting local (dashboard/manager da Evolution). Nao expor publico.
      - "127.0.0.1:${EVOLUTION_PORT:-8085}:8080"
    depends_on:
      evolution-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  # Postgres DEDICADO da Evolution (isolado do postgres do Omni). Sem porta no host:
  # so a Evolution o acessa, pela rede interna do compose. Profile omnichannel.
  evolution-db:
    image: postgres:16-alpine
    profiles: ["omnichannel"]
    restart: unless-stopped
    mem_limit: 512m
    mem_reservation: 128m
    environment:
      POSTGRES_DB: evolution
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: ${EVOLUTION_DB_PASSWORD:-evolution_dev}
    volumes:
      - evolution_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evolution -d evolution"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
  api_uploads:
  api_omnichannel_media:
  api_attendance_audio:
  api_erp_storage:
  web_node_modules:
  web_nuxt:
  automation_redis:
  automation_waha_sessions:
  automation_waha_media:
  automation_n8n_data:
  automation_whisper_cache:
  meta_ads_assistant_auth:
  evolution_instances:
  evolution_db_data:
